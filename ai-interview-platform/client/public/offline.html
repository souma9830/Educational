<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - CamSense AI</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0b0f19;
        color: #e0e0e0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }
      .container {
        max-width: 420px;
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 16px;
        padding: 32px 24px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .icon {
        font-size: 48px;
        margin-bottom: 16px;
        display: inline-block;
        transition: transform 0.3s ease;
      }
      h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #ffffff; }
      p { font-size: 14px; color: #9ca3af; line-height: 1.6; margin-bottom: 20px; }
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 9999px;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 20px;
        background: rgba(239, 68, 68, 0.1);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.2);
        transition: all 0.3s ease;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #ef4444;
        display: inline-block;
      }
      .status-badge.online {
        background: rgba(16, 185, 129, 0.1);
        color: #34d399;
        border-color: rgba(16, 185, 129, 0.2);
      }
      .status-badge.online .status-dot {
        background-color: #10b981;
        animation: pulse 1.5s infinite;
      }
      .status-badge.checking {
        background: rgba(245, 158, 11, 0.1);
        color: #fbbf24;
        border-color: rgba(245, 158, 11, 0.2);
      }
      .status-badge.checking .status-dot {
        background-color: #f59e0b;
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.2); }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 12px 24px;
        background: #6366f1;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .btn:hover { background: #4f46e5; }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon" id="icon">📡</div>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span id="statusText">No Internet Connection</span>
      </div>
      <h1>You're offline</h1>
      <p>CamSense AI needs an active internet connection for AI-powered interviews and assessments. We will automatically reconnect as soon as your network is restored.</p>
      <button class="btn" id="retryBtn" onclick="checkConnectionAndReload()">
        <span>Retry Connection</span>
      </button>
    </div>

    <script>
      const statusBadge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');
      const retryBtn = document.getElementById('retryBtn');
      const icon = document.getElementById('icon');

      function updateStatus(isOnline, isChecking = false) {
        if (isChecking) {
          statusBadge.className = 'status-badge checking';
          statusText.textContent = 'Checking connection...';
          return;
        }
        if (isOnline) {
          statusBadge.className = 'status-badge online';
          statusText.textContent = 'Connection restored! Reloading...';
          icon.style.transform = 'scale(1.1)';
        } else {
          statusBadge.className = 'status-badge';
          statusText.textContent = 'No Internet Connection';
          icon.style.transform = 'scale(1)';
        }
      }

      async function checkConnectionAndReload() {
        updateStatus(false, true);
        retryBtn.disabled = true;

        try {
          const response = await fetch('/api/health?t=' + Date.now(), { method: 'GET', cache: 'no-store' });
          if (response.ok || response.status < 500) {
            updateStatus(true);
            setTimeout(() => {
              window.location.reload();
            }, 800);
            return;
          }
        } catch (err) {
          // Network fetch failed
        }

        if (navigator.onLine) {
          updateStatus(true);
          setTimeout(() => {
            window.location.reload();
          }, 800);
        } else {
          updateStatus(false);
          retryBtn.disabled = false;
        }
      }

      window.addEventListener('online', () => {
        checkConnectionAndReload();
      });

      window.addEventListener('offline', () => {
        updateStatus(false);
      });

      setInterval(() => {
        if (navigator.onLine) {
          checkConnectionAndReload();
        }
      }, 5000);
    </script>
  </body>
</html>
